<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أسعار الفحوصات — مختبر الوتين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* لوحة أسعار داخلية: شريط علوي ثابت + قائمة مجمّعة بالأقسام + نسخة طباعة منفصلة بدون التكلفة */
:root{
  --plum:#5E1A47; --plum2:#7A2A63; --maroon:#901951; --pink:#C2185B; --gold:#E9A400; --gold2:#FFC845;
  --ink:#3a2b42; --muted:#8b7b93; --bg:#FBF7FA; --surface:#ffffff; --line:#EFE3EC; --soft:#F7EEF4;
  --cost:#FFF7E6; --costline:#F3D9A4; --danger:#C62828;
  --display:'Cairo','Tajawal',system-ui,sans-serif; --body:'Tajawal','Cairo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:16px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(194,24,91,.35);outline-offset:2px}

/* ===== الشريط العلوي ===== */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  box-shadow:0 4px 18px rgba(94,26,71,.06)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);flex:none;background:#fff}
.brand b{display:block;font-family:var(--display);font-weight:900;font-size:21px;color:var(--plum);line-height:1.1}
.brand span{display:block;font-size:14px;color:var(--gold);font-weight:800;margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:12px;padding:10px 16px;
  font-family:var(--display);font-weight:800;font-size:15px;white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:linear-gradient(135deg,var(--plum),var(--maroon));color:#fff;box-shadow:0 6px 16px rgba(94,26,71,.25)}
.btn.ghost{background:var(--soft);color:var(--plum)}
.btn.ghost[aria-pressed="true"]{background:#FFF1D6;color:#8a5a00}

/* ===== المحتوى ===== */
main{max-width:1080px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.tools{display:flex;flex-direction:column;gap:12px}
.search{position:relative}
.search input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;
  padding:13px 46px 13px 14px;font-size:16px}
.search svg{position:absolute;right:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;
  font-weight:700;font-size:14px;color:var(--plum);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  margin:16px 2px 8px;font-size:14px;color:var(--muted);font-weight:600}
.meta .saved{display:inline-flex;align-items:center;gap:6px}
.meta .dot{width:8px;height:8px;border-radius:50%;background:#2E8B3D}

/* ===== الجدول ===== */
.grid{--cols:minmax(0,1fr) 104px 178px 104px 40px}
.thead{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:end;padding:0 14px 8px;
  font-size:13px;font-weight:800;color:var(--muted)}
.thead .c-cost{color:#9a6a00;display:flex;align-items:center;gap:5px}
.thead .c-cost svg{width:14px;height:14px;stroke:#9a6a00}
.sec{margin-top:14px}
.sec-h{display:flex;align-items:center;gap:10px;padding:8px 4px;font-family:var(--display);font-weight:900;
  font-size:17px;color:var(--plum)}
.sec-h .n{font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted);background:var(--soft);
  border-radius:999px;padding:2px 10px}
.sec-h::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--line),transparent)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:center;padding:8px 14px;
  border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:#FDFAFC}
.nm{width:100%;border:1.5px solid transparent;background:transparent;border-radius:10px;padding:8px 8px;
  font-weight:700;font-size:15.5px;color:var(--ink);min-width:0}
.nm:hover{border-color:var(--line)} .nm:focus{border-color:var(--pink);background:#fff;outline:none}
.num{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;
  text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;direction:ltr;min-width:0}
.num:focus{border-color:var(--pink);outline:none}
.num::placeholder{color:#cdbfca;font-weight:600}
.c-cost .num{background:var(--cost);border-color:var(--costline);border-style:dashed}
.rng{display:flex;align-items:center;gap:6px}
.rng span{color:var(--muted);font-weight:800}
.lbl{display:none}
.del{width:36px;height:36px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center}
.del svg{width:18px;height:18px;stroke:#c9b3c3}
.del:hover{background:#FDECEC} .del:hover svg{stroke:var(--danger)}
.confirm{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:#FFF3F3;border-radius:12px;padding:10px 12px;font-weight:700;color:var(--danger)}
.confirm div{display:flex;gap:8px}
.confirm button{border:0;border-radius:10px;padding:8px 14px;font-weight:800}
.confirm .yes{background:var(--danger);color:#fff} .confirm .no{background:#fff;color:var(--ink)}
body.hide-cost .c-cost{visibility:hidden}

.empty{text-align:center;padding:40px 16px;color:var(--muted);font-weight:700}
.add{margin-top:16px;width:100%;border:2px dashed #E3CADB;background:transparent;border-radius:16px;padding:14px;
  font-family:var(--display);font-weight:800;font-size:16px;color:var(--plum)}
.add:hover{background:var(--soft)}
.backup{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.backup .btn{font-size:14px;padding:9px 14px}
.note{margin-top:10px;text-align:center;font-size:13px;color:var(--muted)}

/* ===== النوافذ ===== */
.modal{position:fixed;inset:0;z-index:50;background:rgba(40,16,34,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.card{width:min(460px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 24px 60px rgba(40,16,34,.3)}
.card h2{font-family:var(--display);font-weight:900;font-size:22px;color:var(--plum);margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:800;font-size:14px;color:var(--muted)}
.field input,.field select{border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;background:#fff}
.check{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;
  margin-bottom:8px;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--plum)}
.check.locked{background:#FFF7E6;border-color:var(--costline);color:#8a5a00}
.card .row-b{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:var(--plum);color:#fff;font-weight:700;padding:11px 18px;border-radius:12px;z-index:60;
  box-shadow:0 10px 26px rgba(40,16,34,.3)}
.toast[hidden]{display:none}

/* ===== جوال ===== */
@media (max-width:720px){
  .thead{display:none}
  .row{grid-template-columns:1fr 1fr 40px;grid-template-areas:"nm nm del" "cost l2l l2l" "rng rng rng";row-gap:8px;padding:12px}
  .row .c-nm{grid-area:nm} .row .c-cost{grid-area:cost} .row .c-rng{grid-area:rng}
  .row .c-l2l{grid-area:l2l} .row .c-del{grid-area:del;justify-self:end}
  .lbl{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
  .c-cost .lbl{color:#9a6a00}
  .brand img{width:44px;height:44px} .brand b{font-size:18px}
}

/* ===== الطباعة ===== */
#printArea{display:none}
@media print{
  @page{size:A4;margin:8mm 8mm 8mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.p-head{display:flex;align-items:center;justify-content:space-between;border-bottom:2.5px solid var(--plum);padding-bottom:2.4mm;margin-bottom:3mm}
.p-brand{display:flex;align-items:center;gap:3mm}
.p-brand img{width:15mm;height:15mm;border-radius:50%}
.p-brand b{display:block;font-family:var(--display);font-weight:900;font-size:17pt;color:var(--plum);line-height:1.1}
.p-brand span{display:block;font-size:9.5pt;color:var(--gold);font-weight:800}
.p-title{text-align:left}
.p-title b{display:block;font-family:var(--display);font-weight:900;font-size:14pt;color:var(--pink)}
.p-title span{font-size:9pt;color:var(--muted);font-weight:700}
.p-cols{columns:2;column-gap:6mm}
.p-sec{break-inside:avoid;margin-bottom:2.4mm}
.p-sec h3{font-family:var(--display);font-weight:900;font-size:10pt;color:#fff;background:var(--plum);
  border-radius:2mm 2mm 0 0;padding:.9mm 3mm}
.p-sec table{width:100%;border-collapse:collapse;font-size:8.9pt}
.p-sec th{font-size:7.4pt;color:var(--muted);font-weight:800;text-align:center;padding:.6mm 1.5mm;background:var(--soft);white-space:nowrap}
.p-sec th:first-child{text-align:right}
.p-sec td{padding:.78mm 1.5mm;border-bottom:.3mm solid var(--line);font-weight:700;color:var(--ink)}
.p-sec td.v{text-align:center;font-weight:800;direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums;width:17mm}
.p-sec tr:nth-child(even) td{background:#FCF8FB}
.p-foot{margin-top:2.5mm;border-top:.4mm solid var(--line);padding-top:2.5mm;display:flex;justify-content:space-between;
  font-size:9pt;color:var(--muted);font-weight:700}
.p-foot .ph{direction:ltr;font-weight:800;color:var(--plum)}
</style>
</head>

      <div style="text-align:center">لاب تو لاب ₪</div>
      <div></div>
    </div>
    <div id="list"></div>
  </div>

  <button class="add" id="btnAdd">+ إضافة فحص جديد</button>

  <div class="backup">
    <button class="btn ghost" id="btnExport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
      حفظ نسخة احتياطية</button>
    <button class="btn ghost" id="btnImport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M4 19h16"/></svg>
      استرجاع نسخة</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
  <p class="note">الأسعار محفوظة على هذا الجهاز فقط — سعر التكلفة ما بيطلع بالطباعة ولا بالـ PDF أبداً.</p>
</main>

<!-- نافذة إضافة فحص -->
<div class="modal" id="addDlg" hidden>
  <div class="card" role="dialog" aria-labelledby="addTitle">
    <h2 id="addTitle">إضافة فحص</h2>
    <div class="field"><label for="newName">اسم الفحص</label><input id="newName" placeholder="مثلاً: فيتامين ب9 (Folate)"></div>
    <div class="field"><label for="newSec">القسم</label><select id="newSec"></select></div>
    <div class="row-b"><button class="btn primary" id="addOk">إضافة</button><button class="btn ghost" id="addCancel">إلغاء</button></div>
  </div>
</div>

<!-- نافذة الطباعة -->
<div class="modal" id="prDlg" hidden>
  <div class="card" role="dialog" aria-labelledby="prTitle">
    <h2 id="prTitle">شو بدك يطلع بالطباعة؟</h2>
    <label class="check"><input type="checkbox" id="pRange" checked> مدى السعر</label>
    <label class="check"><input type="checkbox" id="pL2l" checked> سعر لاب تو لاب</label>
    <label class="check locked"><input type="checkbox" disabled> سعر التكلفة — ما بينطبع أبداً</label>
    <div class="field" style="margin-top:10px"><label for="pTitleIn">عنوان الورقة</label><input id="pTitleIn" value="قائمة أسعار الفحوصات"></div>
    <div class="row-b"><button class="btn primary" id="prOk">اطبع / احفظ PDF</button><button class="btn ghost" id="prCancel">إلغاء</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div id="printArea"></div>

<script>
const LOGO = document.querySelector('.brand img').src;
const KEY = 'wateen_prices_v1';
const SEED = [{"sec": "قسم الدم", "name": "صورة دم كاملة (CBC)", "price": 20}, {"sec": "قسم الدم", "name": "سرعة الترسيب (ESR)", "price": 15}, {"sec": "قسم الدم", "name": "فصيلة الدم (Blood Group + Rh)", "price": 15}, {"sec": "قسم الدم", "name": "زمن البروثرومبين (PT/INR)", "price": 25}, {"sec": "قسم الدم", "name": "زمن الثرومبوبلاستين (PTT)", "price": 25}, {"sec": "قسم الدم", "name": "الخلايا الشبكية (Reticulocytes)", "price": 20}, {"sec": "قسم الدم", "name": "فحص المنجلية (Sickling)", "price": 20}, {"sec": "قسم الدم", "name": "إنزيم G6PD (فول)", "price": 40}, {"sec": "قسم الكيمياء", "name": "سكر صائم (FBS)", "price": 10}, {"sec": "قسم الكيمياء", "name": "سكر عشوائي (RBS)", "price": 10}, {"sec": "قسم الكيمياء", "name": "السكر التراكمي (HbA1c)", "price": 30}, {"sec": "قسم الكيمياء", "name": "صورة الدهنيات (Lipid Profile)", "price": 35}, {"sec": "قسم الكيمياء", "name": "وظائف الكبد (LFT)", "price": 40}, {"sec": "قسم الكيمياء", "name": "وظائف الكلى (يوريا/كرياتينين)", "price": 30}, {"sec": "قسم الكيمياء", "name": "حمض اليوريك (Uric Acid)", "price": 15}, {"sec": "قسم الكيمياء", "name": "الكالسيوم (Calcium)", "price": 15}, {"sec": "قسم الكيمياء", "name": "الأملاح (Na / K / Cl)", "price": 30}, {"sec": "قسم الكيمياء", "name": "الأميليز (Amylase)", "price": 30}, {"sec": "قسم الكيمياء", "name": "بروتين CRP", "price": 25}, {"sec": "قسم الكيمياء", "name": "الفيريتين (مخزون الحديد)", "price": 50}, {"sec": "قسم الكيمياء", "name": "الحديد (Serum Iron)", "price": 25}, {"sec": "قسم الهرمونات", "name": "هرمون الغدة الدرقية (TSH)", "price": 45}, {"sec": "قسم الهرمونات", "name": "الثيروكسين الحر (FT4)", "price": 45}, {"sec": "قسم الهرمونات", "name": "ثلاثي يود الثيرونين (FT3)", "price": 45}, {"sec": "قسم الهرمونات", "name": "فيتامين د (Vitamin D)", "price": 60}, {"sec": "قسم الهرمونات", "name": "فيتامين ب12", "price": 55}, {"sec": "قسم الهرمونات", "name": "البرولاكتين (Prolactin)", "price": 45}, {"sec": "قسم الهرمونات", "name": "هرمون التستوستيرون", "price": 50}, {"sec": "قسم الهرمونات", "name": "الهرمون الملوتن (LH)", "price": 45}, {"sec": "قسم الهرمونات", "name": "الهرمون المنبه للجريب (FSH)", "price": 45}, {"sec": "قسم الهرمونات", "name": "الكورتيزول (Cortisol)", "price": 55}, {"sec": "قسم الهرمونات", "name": "الإنسولين (Insulin)", "price": 55}, {"sec": "قسم الهرمونات", "name": "هرمون الحمل (Beta HCG)", "price": 40}, {"sec": "قسم المناعة", "name": "الأجسام المضادة للنواة (ANA)", "price": 70}, {"sec": "قسم المناعة", "name": "العامل الروماتويدي (RF)", "price": 30}, {"sec": "قسم المناعة", "name": "أنتي ستربتوليسين (ASOT)", "price": 30}, {"sec": "قسم المناعة", "name": "الأجسام المناعية (IgE الكلي)", "price": 50}, {"sec": "قسم المناعة", "name": "جرثومة المعدة (H. Pylori Ab)", "price": 40}, {"sec": "قسم المناعة", "name": "فحص التيفوئيد (Widal)", "price": 25}, {"sec": "قسم الفيروسات", "name": "التهاب الكبد B (HBsAg)", "price": 40}, {"sec": "قسم الفيروسات", "name": "التهاب الكبد C (HCV Ab)", "price": 60}, {"sec": "قسم الفيروسات", "name": "فيروس نقص المناعة (HIV)", "price": 60}, {"sec": "قسم الفيروسات", "name": "الفيروس المضخم (CMV IgG/IgM)", "price": 70}, {"sec": "قسم الفيروسات", "name": "الحصبة الألمانية (Rubella IgG/IgM)", "price": 70}, {"sec": "قسم الفيروسات", "name": "داء المقوسات (Toxoplasma IgG/IgM)", "price": 70}, {"sec": "قسم المزارع", "name": "مزرعة بول + حساسية", "price": 45}, {"sec": "قسم المزارع", "name": "مزرعة براز + حساسية", "price": 45}, {"sec": "قسم المزارع", "name": "مزرعة دم + حساسية", "price": 60}, {"sec": "قسم المزارع", "name": "مزرعة حلق + حساسية", "price": 40}, {"sec": "قسم المزارع", "name": "مزرعة جرح + حساسية", "price": 45}, {"sec": "قسم دلالات الأورام", "name": "دلالة البروستاتا (PSA)", "price": 55}, {"sec": "قسم دلالات الأورام", "name": "الدلالة السرطانية (CEA)", "price": 60}, {"sec": "قسم دلالات الأورام", "name": "ألفا فيتو بروتين (AFP)", "price": 60}, {"sec": "قسم دلالات الأورام", "name": "دلالة المبيض (CA-125)", "price": 65}, {"sec": "قسم دلالات الأورام", "name": "دلالة الثدي (CA 15-3)", "price": 65}, {"sec": "قسم دلالات الأورام", "name": "دلالة البنكرياس (CA 19-9)", "price": 65}, {"sec": "قسم السوائل", "name": "تحليل بول عام", "price": 15}, {"sec": "قسم السوائل", "name": "تحليل براز عام", "price": 15}, {"sec": "قسم السوائل", "name": "تحليل السائل المنوي", "price": 40}, {"sec": "قسم السوائل", "name": "الدم الخفي بالبراز", "price": 20}];
const ADDR = 'دير البلح – البلد، بجوار مسجد أبو سليم';
const PHONES = '0567385853 · 0597210118';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean = v => String(v ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d.]/g, '');

function fresh(){
  return { updated:null, tests: SEED.map((t,i)=>({ id:'t'+i, sec:t.sec, name:t.name, cost:'', min:String(t.price), max:'', l2l:'' })) };
}
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.tests)) return s; }catch(e){}
  return fresh();
}
let state = load();
let filterSec = 'الكل', query = '', pendingDel = null, saveT = null;

function sections(){
  const out = [];
  state.tests.forEach(t => { if(!out.includes(t.sec)) out.push(t.sec); });
  return out;
}
function save(){
  state.updated = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast('ما قدرت أحفظ — المتصفح مانع التخزين'); }
  showSaved();
}
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 350); }
function showSaved(){
  if(!state.updated){ $('#saved').textContent = 'محفوظ على هذا الجهاز'; return; }
  const d = new Date(state.updated);
  $('#saved').textContent = 'آخر حفظ ' + d.toLocaleTimeString('ar-EG-u-nu-latn',{hour:'2-digit',minute:'2-digit'});
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(()=> t.hidden = true, 2200);
}

function renderChips(){
  const secs = ['الكل', ...sections()];
  $('#chips').innerHTML = secs.map(s =>
    `<button class="chip" aria-pressed="${s===filterSec}" data-sec="${esc(s)}">${esc(s.replace('قسم ',''))}</button>`).join('');
}
function matches(t){
  if(filterSec !== 'الكل' && t.sec !== filterSec) return false;
  if(!query) return true;
  return t.name.toLowerCase().includes(query.toLowerCase());
}
function rowHTML(t){
  if(pendingDel === t.id){
    return `<div class="row" data-id="${t.id}"><div class="confirm"><span>حذف «${esc(t.name)}»؟</span>
      <div><button class="yes" data-act="del-yes">حذف</button><button class="no" data-act="del-no">إلغاء</button></div></div></div>`;
  }
  return `<div class="row" data-id="${t.id}">
    <div class="c-nm"><input class="nm" data-f="name" value="${esc(t.name)}" aria-label="اسم الفحص"></div>
    <div class="c-cost"><span class="lbl">التكلفة (خاص)</span><input class="num" data-f="cost" inputmode="decimal" placeholder="—" value="${esc(t.cost)}" aria-label="سعر التكلفة"></div>
    <div class="c-rng"><span class="lbl">مدى السعر ₪ (من – إلى)</span><div class="rng">
      <input class="num" data-f="min" inputmode="decimal" placeholder="من" value="${esc(t.min)}" aria-label="السعر من">
      <span>–</span>
      <input class="num" data-f="max" inputmode="decimal" placeholder="إلى" value="${esc(t.max)}" aria-label="السعر إلى"></div></div>
    <div class="c-l2l"><span class="lbl">لاب تو لاب ₪</span><input class="num" data-f="l2l" inputmode="decimal" placeholder="—" value="${esc(t.l2l)}" aria-label="سعر لاب تو لاب"></div>
    <div class="c-del"><button class="del" data-act="del" aria-label="حذف الفحص"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></div>
  </div>`;
}
function render(){
  renderChips();
  const shown = state.tests.filter(matches);
  const total = state.tests.length, withCost = state.tests.filter(t=>t.cost).length;
  $('#count').textContent = `${total} فحص · ${withCost} معبّى سعر تكلفتهم`;
  if(!shown.length){ $('#list').innerHTML = `<div class="empty">ما في فحص بهالاسم — جرّب كلمة ثانية أو أضفه من الزر تحت</div>`; return; }
  $('#list').innerHTML = sections().map(sec => {
    const items = shown.filter(t => t.sec === sec);
    if(!items.length) return '';
    return `<div class="sec"><div class="sec-h">${esc(sec)}<span class="n">${items.length}</span></div>
      <div class="rows">${items.map(rowHTML).join('')}</div></div>`;
  }).join('');
  showSaved();
}

/* تعديل مباشر */
$('#list').addEventListener('input', e => {
  const inp = e.target.closest('[data-f]'); if(!inp) return;
  const t = state.tests.find(x => x.id === inp.closest('.row').dataset.id); if(!t) return;
  const f = inp.dataset.f;
  if(f === 'name'){ t.name = inp.value; }
  else { const v = clean(inp.value); if(v !== inp.value) inp.value = v; t[f] = v; }
  saveSoon();
});
$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const id = b.closest('.row').dataset.id;
  if(b.dataset.act === 'del'){ pendingDel = id; render(); }
  if(b.dataset.act === 'del-no'){ pendingDel = null; render(); }
  if(b.dataset.act === 'del-yes'){ state.tests = state.tests.filter(t => t.id !== id); pendingDel = null; save(); render(); toast('انحذف الفحص'); }
});
$('#chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return; filterSec = c.dataset.sec; render();
});
$('#q').addEventListener('input', e => { query = e.target.value.trim(); render(); });

/* إخفاء التكلفة على الشاشة */
let hideCost = false;
try{ hideCost = localStorage.getItem(KEY+'_hide') === '1'; }catch(e){}
function applyHide(){
  document.body.classList.toggle('hide-cost', hideCost);
  $('#btnCost').setAttribute('aria-pressed', hideCost);
  $('#btnCost span').textContent = hideCost ? 'إظهار التكلفة' : 'إخفاء التكلفة';
}
$('#btnCost').addEventListener('click', () => {
  hideCost = !hideCost; applyHide();
  try{ localStorage.setItem(KEY+'_hide', hideCost ? '1' : '0'); }catch(e){}
});

/* إضافة فحص */
$('#btnAdd').addEventListener('click', () => {
  $('#newSec').innerHTML = sections().map(s => `<option>${esc(s)}</option>`).join('') + `<option value="__new">+ قسم جديد…</option>`;
  if(filterSec !== 'الكل') $('#newSec').value = filterSec;
  $('#newName').value = ''; $('#addDlg').hidden = false; setTimeout(()=>$('#newName').focus(), 30);
});
$('#newSec').addEventListener('change', e => {
  if(e.target.value === '__new'){
    const n = $('#newName');
    const inp = document.createElement('input'); inp.id = 'newSecName'; inp.placeholder = 'اسم القسم الجديد';
    if(!$('#newSecName')) e.target.after(inp);
  } else { $('#newSecName')?.remove(); }
});
$('#addCancel').addEventListener('click', () => { $('#addDlg').hidden = true; $('#newSecName')?.remove(); });
$('#addOk').addEventListener('click', () => {
  const name = $('#newName').value.trim();
  if(!name){ $('#newName').focus(); toast('اكتب اسم الفحص أول'); return; }
  let sec = $('#newSec').value;
  if(sec === '__new'){ const s = ($('#newSecName')?.value || '').trim(); if(!s){ toast('اكتب اسم القسم'); return; } sec = s.startsWith('قسم') ? s : 'قسم ' + s; }
  const t = { id:'n'+Date.now(), sec, name, cost:'', min:'', max:'', l2l:'' };
  const lastIdx = state.tests.map(x=>x.sec).lastIndexOf(sec);
  if(lastIdx >= 0) state.tests.splice(lastIdx+1, 0, t); else state.tests.push(t);
  $('#addDlg').hidden = true; $('#newSecName')?.remove();
  filterSec = 'الكل'; query = ''; $('#q').value = '';
  save(); render();
  const el = document.querySelector(`[data-id="${t.id}"] [data-f="cost"]`);
  el?.scrollIntoView({block:'center'}); el?.focus();
  toast('انضاف — عبّي الأسعار');
});

/* نسخ احتياطي */
$('#btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date(); const stamp = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  a.href = URL.createObjectURL(blob); a.download = `اسعار-الوتين-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('انحفظت النسخة الاحتياطية');
});
$('#btnImport').addEventListener('click', () => $('#fileIn').click());
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const s = JSON.parse(await f.text());
    if(!s || !Array.isArray(s.tests)) throw 0;
    state = s; save(); render(); toast('رجعت الأسعار من النسخة');
  }catch(err){ toast('الملف مش نسخة أسعار صحيحة'); }
  e.target.value = '';
});

/* الطباعة — التكلفة مش موجودة بالنسخة المطبوعة أصلاً */
function fmtRange(t){
  let a = t.min, b = t.max;
  if(a && b && +a > +b) [a, b] = [b, a];
  if(a && b && a !== b) return `${a} – ${b}`;
  return a || b || '—';
}
function buildPrint(opt){
  const cols = [];
  if(opt.range) cols.push(['مدى السعر', fmtRange]);
  if(opt.l2l) cols.push(['لاب تو لاب', t => t.l2l || '—']);
  const d = new Date();
  const date = d.toLocaleDateString('ar-EG-u-nu-latn',{year:'numeric',month:'long',day:'numeric'});
  const body = sections().map(sec => {
    const items = state.tests.filter(t => t.sec === sec); if(!items.length) return '';
    return `<div class="p-sec"><h3>${esc(sec)}</h3><table><thead><tr><th>الفحص</th>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead>
      <tbody>${items.map(t => `<tr><td>${esc(t.name)}</td>${cols.map(c=>`<td class="v">${esc(c[1](t))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }).join('');
  $('#printArea').innerHTML = `
    <div class="p-head"><div class="p-brand"><img src="${LOGO}" alt=""><div><b>مختبر الوتين الطبي</b><span>للتحاليل الطبية</span></div></div>
      <div class="p-title"><b>${esc(opt.title)}</b><span>الأسعار بالشيكل ₪ · تاريخ التحديث: ${date}</span></div></div>
    <div class="p-cols">${body}</div>
    <div class="p-foot"><span>${ADDR}</span><span class="ph">${PHONES}</span></div>`;
}
let printOpt = { range:true, l2l:true, title:'قائمة أسعار الفحوصات' };
function syncTitle(){
  const r = $('#pRange').checked, l = $('#pL2l').checked, inp = $('#pTitleIn');
  const auto = ['قائمة أسعار الفحوصات','أسعار لاب تو لاب'];
  if(auto.includes(inp.value)) inp.value = (l && !r) ? 'أسعار لاب تو لاب' : 'قائمة أسعار الفحوصات';
}
$('#pRange').addEventListener('change', syncTitle);
$('#pL2l').addEventListener('change', syncTitle);
$('#btnPrint').addEventListener('click', () => { $('#prDlg').hidden = false; });
$('#prCancel').addEventListener('click', () => { $('#prDlg').hidden = true; });
$('#prOk').addEventListener('click', () => {
  printOpt = { range:$('#pRange').checked, l2l:$('#pL2l').checked, title:$('#pTitleIn').value.trim() || 'قائمة أسعار الفحوصات' };
  if(!printOpt.range && !printOpt.l2l){ toast('اختار عمود واحد على الأقل'); return; }
  $('#prDlg').hidden = true;
  buildPrint(printOpt);
  setTimeout(() => window.print(), 60);
});
window.addEventListener('beforeprint', () => { if(!$('#printArea').innerHTML) buildPrint(printOpt); });
window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ $('#addDlg').hidden = true; $('#prDlg').hidden = true; } });

window.__buildPrint = buildPrint;
applyHide(); render();
</script>
</body>
</html>
