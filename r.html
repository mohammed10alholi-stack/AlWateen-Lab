<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6B1B33">
<title>نتيجة الفحص — مختبر الوتين الطبي</title>
<style>
  :root{
    --maroon:#6B1B33;
    --maroon-deep:#4A0F22;
    --gold:#C9A227;
    --rose:#B5566E;
    --paper:#FBF8F6;
    --ink:#241017;
    --muted:#8A7079;
    --line:#EADFE2;
    --high:#B3261E;
    --low:#9A6700;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif;
    font-size:16px;line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

  /* ── الترويسة ── */
  .top{
    background:linear-gradient(180deg,var(--maroon) 0%,var(--maroon-deep) 100%);
    color:#fff;padding:22px 20px 18px;
    padding-top:calc(22px + env(safe-area-inset-top));
  }
  .top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.2px}
  .top .sub{font-size:12px;opacity:.72;margin-top:2px}
  .rule{height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:14px;border-radius:2px}

  .wrap{max-width:640px;margin:0 auto;padding:0 14px 40px}

  /* (تصميم البطاقات القديم أُزيل — الورقة صارت هي التصميم) */

  /* ── تذييل ── */
  /* ── نتائج النماذج (بول، براز، مزارع، سائل) — نفس FormContent بالمطبوع ── */
  .form{background:transparent;border:0;padding:0;margin-bottom:8px;direction:ltr;text-align:left}
  .form .ftitle{font-weight:800;color:#7A1F3D;font-size:13px;margin:0 0 2px}
  .form .ftitle span{color:#9ca3af;font-size:11px;font-weight:400}
  .sec{margin-top:4px}
  .sec .st{font-weight:800;color:#3B1656;font-size:12.5px;text-align:center;
    background:#E3CFE3;padding:2px 8px;border-radius:6px;margin:1px 0 3px}
  /* الحقول عمودين، تماماً كالورقة */
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px 20px;font-size:12px}
  .fgrid.one{grid-template-columns:1fr}
  .fr{display:flex;gap:6px;border-bottom:1px solid #f5f0f5;padding:1px 4px}
  .fr .fl{color:#374151}
  .fr .fv{font-weight:700}
  .fr .fu{color:#6b7280;font-weight:400}
  .fr.stack{display:block}
  .fr.stack .fv{display:block;font-weight:700;overflow-wrap:anywhere;line-height:1.6}

  /* ── الحساسية للمضادات — نفس صفحة المزرعة بالمطبوع ── */
  .sec .st.sens-t{font-size:13px;padding:3px 8px;margin:2px 0 4px}
  .sirkey{display:flex;gap:14px;justify-content:flex-end;font-size:9.5px;margin-bottom:5px;direction:ltr}
  .sirkey b{font-weight:800}
  /* عمودان متوازنان من عائلات المضادات */
  .fams{column-count:2;column-gap:16px;direction:ltr}
  .fam{break-inside:avoid;page-break-inside:avoid;margin-bottom:7px}
  .fam .fh{font-weight:800;font-size:11px;color:#7A1F3D;background:#F7EEF2;
    padding:2px 8px;border-left:3px solid #C9A227;border-radius:3px;margin-bottom:2px}
  .fam table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:10.5px}
  .fam td{padding:2px 5px;border-bottom:1px solid #fff;vertical-align:top;overflow-wrap:anywhere}
  .fam td.ab{font-weight:600;color:#111827;line-height:1.22;width:50%}
  .fam td.ab small{display:block;color:#4B5563;font-size:9px;font-weight:700}
  .fam td.mm{text-align:center;font-weight:700;width:22%}
  .fam td.sir{text-align:center;font-weight:800;width:28%}
  .fam tr.S{background:#FDF2F2} .fam tr.S td.sir{color:#C81E1E}
  .fam tr.R{background:#F2F3F5} .fam tr.R td.sir{color:#111827}
  .fam tr.I{background:#EFF4FF} .fam tr.I td.sir{color:#1D4ED8}
  .fam tr.none td.sir{color:#9ca3af}
  .reftbl{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .reftbl .rt{font-weight:800;font-size:13px;color:var(--maroon);text-align:center;margin-bottom:8px;line-height:1.4}
  .reftbl table{width:100%;border-collapse:collapse;font-size:13px}
  .reftbl td{padding:4px 8px;border-bottom:1px dashed var(--line)}
  .reftbl td:last-child{direction:ltr;text-align:left;font-weight:700}
  .reftbl tr:last-child td{border-bottom:0}
  .note{
    margin-top:24px;background:#fff;border:1px solid var(--line);
    border-right:3px solid var(--gold);border-radius:12px;padding:14px;
    font-size:13px;color:var(--muted);line-height:1.7;
  }
  .foot{margin-top:18px;text-align:center;font-size:12px;color:var(--muted);line-height:1.9}
  .foot a{color:var(--maroon);text-decoration:none;font-weight:700}
  .amend{
    display:table;text-align:center;margin:0 auto 8px;padding:5px 12px;border-radius:8px;
    border:1.5px solid #b45309;background:#FEF3C7;color:#92400E;
    font-size:12px;font-weight:700;
  }

  /* ── حالات ── */
  .brandimg{display:block;width:100%;height:auto}
  .brandTop.has-img .top{display:none}
  .brandTop .top{padding:14px 12mm 12px}
  .brandBottom{margin-top:auto}
  /* ── زر حفظ النتيجة ── */
  .savebar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(251,248,246,0) 0%,var(--paper) 45%)}
  .savebtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--maroon);color:#fff;border:0;border-radius:12px;padding:14px;
    font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;
    box-shadow:0 6px 18px rgba(74,15,34,.22)}
  .savebtn:active{transform:translateY(1px)}
  .savebtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .savehint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.6}
  .sitelink{display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:14px;background:#fff;border:1.5px solid var(--line);border-radius:12px;
    padding:13px;font-size:14.5px;font-weight:700;color:var(--maroon);text-decoration:none}
  .sitelink svg{flex-shrink:0}
  .savealt{display:none;margin-top:9px;background:#fff;border:1.5px solid var(--maroon);color:var(--maroon);
    border-radius:12px;padding:12px;width:100%;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
  .savewarn{display:none;margin-top:9px;background:#FBF3E0;border:1px solid #E8D6A8;color:#7A5A00;
    border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.7;text-align:right}

  @media print{
    @page{ size:A4; margin:0 }
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact }
    body{background:#fff;font-size:11pt}
    /* ما لا يخصّ الورقة لا يُطبع */
    .savebar,.savehint,.savealt,.savewarn,.sitelink,.note,.zoombar,.foot{display:none !important}
    #stage{overflow:visible}
    #pages{transform:none !important;width:210mm}
    .page{width:210mm;min-height:297mm;box-shadow:none;break-after:page;page-break-after:always}
    .page:last-child{break-after:auto;page-break-after:auto}
    .page + .page{margin-top:0}
    .wrap{max-width:none;padding:0;margin:0}
    .sheet{box-shadow:none;border-radius:0;padding:0;margin:0}
    .brandimg{width:100%;height:auto;display:block}
    /* التقرير كتلة واحدة لا تنكسر إلى صفحة ثانية */
    .pbox,.sig,.form,.reftbl{break-inside:avoid}
    table.res{font-size:9.5pt}
    table.res th,table.res td{padding:3px 6px}
    table.res tr{break-inside:avoid}
    .rtitle{margin:4px 0 6px;font-size:12pt}
    .pbox{margin-bottom:6px;padding:6px 9px;font-size:9.5pt}
    .sig{margin:14px 6px 2px}
  }

  .state{text-align:center;padding:60px 24px;color:var(--muted)}
  .state h2{color:var(--ink);font-size:18px;margin:0 0 8px}
  .state p{margin:0;font-size:14px;line-height:1.8}
  .spin{
    width:26px;height:26px;margin:0 auto 16px;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--maroon);
    animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
  .retry{
    margin-top:16px;background:var(--maroon);color:#fff;border:0;
    border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
  .retry:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ═══ ورقة A4 حقيقية: 210×297mm بنفس أبعاد النسخة المطبوعة ═══
   المحتوى مبني بعرض 210mm بالضبط، وبنصغّره بصرياً ليناسب الشاشة —
   فالنِسَب وأحجام الخطوط والهوامش تطابق الورقة تماماً. */
#stage{overflow:hidden;display:flex;justify-content:center;align-items:flex-start}
#pages{align-self:flex-start}
#pages{width:210mm;flex:none;transform-origin:top center}
.page{
  width:210mm;min-height:297mm;background:#fff;
  box-shadow:0 2px 14px rgba(17,24,39,.13);
  display:flex;flex-direction:column;overflow:hidden;
}
.page + .page{margin-top:6mm}
/* هامش المحتوى — نفس PAGE_PAD بالبرنامج */
.pbody{flex:1;padding:0 12mm;display:flex;flex-direction:column}
/* شريط التكبير */
.zoombar{display:flex;gap:8px;justify-content:center;align-items:center;margin:10px 0 4px}
.zoombtn{background:#fff;border:1.5px solid var(--line);color:var(--maroon);
  border-radius:10px;padding:7px 14px;font-size:13px;font-weight:700;
  font-family:inherit;cursor:pointer}
.zoombtn.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.sheet{background:transparent;padding:0}
/* خط الترويسة المتدرّج — نفس الي فوق جملة Lab Report بالورقة */
.hrule{height:2.5px;border-radius:2px;margin:4px 0 2px;
  background:linear-gradient(90deg,#7A1F3D,#C9A227)}
.rtitle{text-align:center;font-weight:700;color:#472069;font-size:15px;margin:3px 0}
.pbox{background:#faf7fb;border-radius:10px;padding:5px 16px;font-size:12.5px;
  display:grid;grid-template-columns:1fr 1fr;gap:3px 28px;direction:ltr;text-align:left;margin-bottom:6px}
.pbox b{color:#7A1F3D}
table.res{width:100%;border-collapse:collapse;direction:ltr;text-align:left;font-size:13px}
table.res th{background:#E3CFE3;color:#3B1656;font-weight:700;padding:7px 8px;
  text-align:left;border:1px solid #d9c4d9}
table.res th.c{text-align:center}
table.res td{padding:7px 8px;border:1px solid #eee;vertical-align:top;text-align:left}
table.res tr.cat td{background:#F3EAF3;font-weight:700;color:#5B2A86;padding:5px 10px;
  border:1px solid #d9c4d9;letter-spacing:.3px;font-size:12.5px}
table.res .tn{color:#111827}
table.res .tn small{color:#6b7280;font-size:11px}
table.res .v{font-weight:700;text-align:center;white-space:nowrap;
  background:#FEF9C3;color:#0B1020}
table.res .u{color:#4b5563;text-align:center;white-space:nowrap}
table.res .rf{color:#4b5563;line-height:1.45;min-width:110px;
  white-space:normal;overflow-wrap:break-word}
.sheet{flex:1;display:flex;flex-direction:column}
.sheet>table.res,.sheet>.form,.sheet>.reftbl{flex:none}
/* يُدفع لأسفل الورقة بالمساحة الفاضية — نفس سلوك flex:1 في Print.jsx */
.sig{display:flex;direction:rtl;justify-content:flex-start;margin:20px 6px 10px;margin-top:auto}
.sig div{border-top:1px solid #9ca3af;padding-top:4px;font-size:11.5px;color:#6b7280;min-width:230px;text-align:center;padding-bottom:2px}
.sig .stampspace{height:26px}
/* لا استعلامات شاشة على الورقة: عرضها 210mm دائماً مهما كان الجهاز،
   والتصغير يتكفّل بالملاءمة — تماماً كورقة مطبوعة. */
</style>
</head>
<body>

<div id="stage"><div id="pages">
  <div class="page"><div class="pbody">
    <div class="state"><div class="spin"></div><p>جارٍ فتح النتيجة…</p></div>
  </div></div>
</div></div>

<div class="wrap"><div id="extras"></div></div>

<script>
(function () {
  var PROJECT = 'alwateen-lab';
  var KEY = 'AIzaSyDJYzJ9q71xKGIPMD2t7URFEEzLa3gb1_E';

  var BHCG_ROWS = [
    ['Non-pregnant','<5'],['2-3 weeks','5-50'],['4 weeks','40-1,000'],['5 weeks','404-20,700'],
    ['6 weeks','2,200-74,200'],['7 weeks','6,000-130,000'],['8 weeks','12,900-190,000'],
    ['9 weeks','18,500-250,000'],['10 weeks','18,000-200,000'],['11 weeks','16,500-180,000'],
    ['12 weeks','14,500-125,000'],['13 weeks','12,500-95,000'],['14 weeks','10,500-80,000'],
    ['15 weeks','9,000-70,000'],['16 weeks','7,500-64,000'],['17 weeks','5,500-56,000'],
    ['18 weeks','4,500-50,000'],['19 weeks','3,300-40,000'],['20 weeks','2,500-32,000'],['21 weeks','1,800-25,000']
  ];

  var TAG = {
    normal:        ['طبيعي', 'ok'],
    high:          ['مرتفع ↑', 'hi'],
    low:           ['منخفض ↓', 'lo'],
    critical_high: ['حرج مرتفع', 'crit'],
    critical_low:  ['حرج منخفض', 'crit'],
    abnormal:      ['غير طبيعي', 'hi']
  };

  var pagesEl = document.getElementById('pages');
  var stage = document.getElementById('stage');
  var extras = document.getElementById('extras');
  var zoomFull = false;
  var lastData = null;

  /* الورقة مبنية بعرض 210mm ثابت — نصغّرها بصرياً لتناسب الشاشة.
     التحويل لا يغيّر ارتفاع المكان المحجوز، فنضبطه يدوياً. */
  function fitPage() {
    var pw = pagesEl.offsetWidth || 794;
    var avail = document.documentElement.clientWidth - 16;
    var sc = zoomFull ? 1 : Math.min(1, avail / pw);
    pagesEl.style.transform = 'scale(' + sc + ')';
    stage.style.height = (pagesEl.offsetHeight * sc) + 'px';
    stage.style.overflowX = sc === 1 ? 'auto' : 'hidden';
  }
  window.addEventListener('resize', fitPage);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function state(title, body, showRetry) {
    pagesEl.innerHTML = '<div class="page"><div class="pbody"><div class="state"><h2>' +
      esc(title) + '</h2><p>' + body + '</p>' +
      (showRetry ? '<button class="retry" id="rt">حاول مرة أخرى</button>' : '') + '</div></div></div>';
    fitPage();
    var b = document.getElementById('rt');
    if (b) b.onclick = load;
  }

  // ── الترويسة والذيل يتكرّران على كل صفحة، تماماً كالمطبوع ──
  function brandTopHtml() {
    var b = window.__brand;
    if (b && b.headerImg) {
      return '<div class="brandTop has-img"><img class="brandimg" alt="" src="' + b.headerImg + '"></div>';
    }
    var nm = (b && b.name) || 'مختبر الوتين الطبي';
    return '<div class="brandTop"><div class="top"><h1>' + esc(nm) + '</h1>' +
           '<div class="sub">تقرير نتائج مخبرية</div><div class="rule"></div></div></div>';
  }
  function brandBottomHtml() {
    var b = window.__brand;
    return '<div class="brandBottom">' +
      (b && b.footerImg ? '<img class="brandimg" alt="" src="' + b.footerImg + '">' : '') + '</div>';
  }
  /** يلفّ محتوى صفحة واحدة بترويسة وذيل وتوقيع */
  function pageShell(head, inner) {
    return '<div class="page">' + brandTopHtml() +
           '<div class="pbody"><div class="sheet">' + head + inner +
           '<div class="sig"><div><div class="stampspace"></div>التوقيع والختم</div></div>' +
           '</div></div>' + brandBottomHtml() + '</div>';
  }

  function fmtDate(s) {
    if (!s) return '';
    var d = new Date(String(s).replace(' ', 'T'));
    if (isNaN(d.getTime())) return s;
    try {
      return d.toLocaleDateString('ar-EG', {
        year: 'numeric', month: 'long', day: 'numeric', numberingSystem: 'latn'
      });
    } catch (e) { return s; }
  }

  var SIRLABEL = { S: 'S \u2014 Sensitive', R: 'R \u2014 Resistant', I: 'I \u2014 Intermediate' };

  function renderForm(r) {
    var h = '<div class="form"><div class="ftitle">' + esc(r.nameAr || r.title || r.name);
    var en = r.name && r.name !== r.nameAr ? r.name : (r.title !== r.nameAr ? r.title : '');
    if (en) h += ' <span>(' + esc(en) + ')</span>';
    h += '</div>';

    (r.sections || []).forEach(function (sec) {
      var fields = sec.fields || [];
      var sens = null;
      fields.forEach(function (f) { if (f.type === 'sensitivity') sens = f; });

      // ── جدول الحساسية ──
      if (sens) {
        h += '<div class="sec"><div class="st sens-t">' + esc(sec.title || 'Antibiotic Sensitivity') + '</div>';
        h += '<div class="sirkey">' +
             '<b style="color:#C81E1E">\u25a0 S = Sensitive</b>' +
             '<b style="color:#1D4ED8">\u25a0 I = Intermediate</b>' +
             '<b style="color:#111827">\u25a0 R = Resistant</b></div>';

        // تجميع حسب العائلة مع الحفاظ على ترتيب ورودها من البرنامج
        var famOrder = [], famMap = {};
        (sens.items || []).forEach(function (it) {
          var fam = it.family || 'Others';
          if (!famMap[fam]) { famMap[fam] = []; famOrder.push(fam); }
          famMap[fam].push(it);
        });

        h += '<div class="fams">';
        famOrder.forEach(function (fam) {
          h += '<div class="fam"><div class="fh">' + esc(fam) + '</div><table><tbody>';
          famMap[fam].forEach(function (it) {
            var v = String(it.sir || '').toUpperCase();
            var cls = /^[SIR]$/.test(v) ? v : 'none';
            var sub = [it.dose || '', it.abbr ? '(' + it.abbr + ')' : ''].filter(Boolean).join(' ');
            h += '<tr class="' + cls + '">' +
                 '<td class="ab">' + esc(it.name) +
                   (sub ? '<small>' + esc(sub) + '</small>' : '') + '</td>' +
                 '<td class="mm">' + (it.mm ? esc(it.mm) + ' mm' : '-') + '</td>' +
                 '<td class="sir">' + (SIRLABEL[v] || '-') + '</td></tr>';
          });
          h += '</tbody></table></div>';
        });
        h += '</div></div>';
        return;
      }

      // ── حقول عادية: شبكة عمودين ──
      var cells = [];
      fields.forEach(function (f) {
        if (f.type === 'list') {
          cells.push({ label: f.label, stack: true,
            value: (f.items || []).map(function (i) { return esc(i.name) + ' ' + esc(i.value); }).join(' \u00b7 ') });
        } else {
          cells.push({ label: f.label, value: esc(f.value), unit: f.unit || '' });
        }
      });
      if (!cells.length) return;

      h += '<div class="sec">';
      if (sec.title) h += '<div class="st">' + esc(sec.title) + '</div>';
      h += '<div class="fgrid' + (cells.length === 1 ? ' one' : '') + '">';
      cells.forEach(function (c) {
        if (c.stack) {
          h += '<div class="fr stack" style="grid-column:1/-1"><span class="fl">' + esc(c.label) +
               ':</span><span class="fv">' + c.value + '</span></div>';
        } else {
          h += '<div class="fr"><span class="fl">' + esc(c.label) + ':</span><span class="fv">' + c.value +
               (c.unit ? ' <span class="fu">' + esc(c.unit) + '</span>' : '') + '</span></div>';
        }
      });
      h += '</div></div>';
    });

    return h + '</div>';
  }

  function render(d) {
    var lab = d.lab || {}, p = d.patient || {}, o = d.order || {}, rows = d.rows || [];
    if (lab.name && window.__brand) window.__brand.name = lab.name;

    lastData = d;
    var html = '';
    html += '<div class="hrule"></div>';
    html += '<div class="rtitle">Lab Report</div>';

    // شريط "تقرير مُعدَّل" مخفيّ بالورقة افتراضياً — فلا يُعرض هنا أيضاً

    // نفس حقول PatientBox بالورقة وبنفس الترتيب
    var gmap = { F: 'Female', C: 'Child' };
    html += '<div class="pbox">';
    html += '<div><b>Patient:</b> ' + esc(p.name || '—') + '</div>';
    html += '<div><b>Patient ID:</b> ' + esc(p.code || '—') + '</div>';
    html += '<div><b>Gender:</b> ' + (gmap[p.gender] || 'Male') + '</div>';
    html += '<div><b>Age:</b> ' + esc(p.ageText || '—') + '</div>';
    html += '<div><b>Date:</b> ' + esc(fmtDate(o.date)) + '</div>';
    html += '<div><b>Order No.:</b> ' + esc(o.code || '—') + '</div>';
    html += '<div><b>Doctor:</b> ' + esc(o.doctor || '—') + '</div>';
    html += '</div>';

    var head = html;   // يتكرّر أعلى كل صفحة، زي ReportPageInner
    html = '';

    // تجميع حسب الفئة مع الحفاظ على ترتيب ورودها
    var order = [], groups = {};
    rows.forEach(function (r) {
      var c = r.category || 'Tests';
      if (!groups[c]) { groups[c] = []; order.push(c); }
      groups[c].push(r);
    });

    var simple = [], forms = [];
    order.forEach(function (cat) {
      var s2 = groups[cat].filter(function (r) { return r.kind !== 'form'; });
      if (s2.length) simple.push([cat, s2]);
      groups[cat].forEach(function (r) { if (r.kind === 'form') forms.push(r); });
    });

    if (simple.length) {
      html += '<table class="res"><thead><tr>' +
              '<th style="width:38%">Test</th><th class="c" style="width:16%">Result</th>' +
              '<th class="c" style="width:14%">Unit</th><th>Reference</th></tr></thead><tbody>';
      simple.forEach(function (g) {
        html += '<tr class="cat"><td colspan="4">' + esc(g[0]) + '</td></tr>';
        g[1].forEach(function (r) {
          html += '<tr><td class="tn">' + esc(r.name || r.nameAr);
          if (r.nameAr && r.name && r.nameAr !== r.name) html += ' <small>(' + esc(r.nameAr) + ')</small>';
          html += '</td>';
          html += '<td class="v">' + esc(r.value || '—') + '</td>';
          html += '<td class="u">' + esc(r.unit || '') + '</td>';
          html += '<td class="rf">' + esc(r.reference || '') + '</td></tr>';
        });
      });
      html += '</tbody></table>';
    }

    var hasHcg = rows.some(function (r) {
      return r.code === 'BHCG' || /hcg/i.test(String(r.name || '') + String(r.nameAr || ''));
    });
    if (hasHcg) {
      html += '<div class="reftbl"><div class="rt">Normal Serum hCG During Pregnancy (mIU/mL)</div><table>';
      BHCG_ROWS.forEach(function (r) {
        html += '<tr><td>' + esc(r[0]) + '</td><td class="num">' + esc(r[1]) + '</td></tr>';
      });
      html += '</table></div>';
    }

    // ── الصفحات: الجدول العادي صفحة، وكل نموذج (بول/براز/مزرعة) صفحة لحاله ──
    var sheets = [];
    if (html.trim() !== '') sheets.push(html);
    forms.forEach(function (r) { sheets.push(renderForm(r)); });
    if (!sheets.length) sheets.push('<div style="text-align:center;color:#9ca3af;padding:30px">لا توجد نتائج بعد</div>');

    pagesEl.innerHTML = sheets.map(function (inner) { return pageShell(head, inner); }).join('');
    html = '';

    // شريط التكبير — ملء العرض أو الحجم الطبيعي
    html += '<div class="zoombar">' +
            '<button class="zoombtn on" id="zFit">ملء الشاشة</button>' +
            '<button class="zoombtn" id="zFull">الحجم الطبيعي</button></div>';

    html += '<div class="note">هذه النتيجة للاطلاع. القراءة النهائية وربطها بحالتك الصحية عند طبيبك — ' +
            'لا تبدأ أو توقف أي علاج بناءً على هذه الصفحة وحدها.</div>';

    // صورة الذيل تغني عن العنوان النصّي — لكن زر الحفظ يُضاف في الحالتين
    var hasFooterImg = !!(window.__brand && window.__brand.footerImg);

    if (!hasFooterImg) {
    html += '<div class="foot">';
    if (lab.name) html += esc(lab.name) + '<br>';
    if (lab.address) html += esc(lab.address) + '<br>';
    if (lab.phone) {
      var tel = String(lab.phone).split(/[^0-9+]/)[0];
      html += '<a class="num" href="tel:' + esc(tel) + '">' + esc(lab.phone) + '</a>';
    }
    html += '</div>';
    }

    // موقع المختبر — مشتقّ من رابط الصفحة نفسها فيبقى متطابقاً مع أي تغيير للنطاق
    var site = location.href.split('/r.html')[0] + '/';
    html += '<a class="sitelink" href="' + esc(site) + '">' +
            '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>' +
            '<path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>' +
            ' موقع مختبر الوتين — حجز وأسعار وعروض</a>';

    html += '<div class="savebar"><button class="savebtn" id="saveBtn">' +
            '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
            ' حفظ النتيجة</button>' +
            '<div class="savehint">تُحفظ كملف PDF على جهازك — اختر «حفظ كـ PDF» من نافذة الطباعة</div>' +
            '<button class="savealt" id="saveAlt">مشاركة الرابط</button>' +
            '<div class="savewarn" id="saveWarn">هذه الصفحة مفتوحة داخل تطبيق آخر، والحفظ لا يعمل هنا.<br>' +
            'افتحها في <b>سفاري</b> أو <b>كروم</b> — اضغط أيقونة المشاركة أو الثلاث نقاط ثم «فتح في المتصفح»، وأعد المحاولة.</div></div>';

    extras.innerHTML = html;
    fitPage();

    var zf = document.getElementById('zFit'), zu = document.getElementById('zFull');
    function setZoom(full) {
      zoomFull = full;
      zf.classList.toggle('on', !full);
      zu.classList.toggle('on', full);
      fitPage();
    }
    if (zf) zf.onclick = function () { setZoom(false); };
    if (zu) zu.onclick = function () { setZoom(true); };

    var sb = document.getElementById('saveBtn');
    var warn = document.getElementById('saveWarn');
    var alt = document.getElementById('saveAlt');

    // بعض المتصفحات المدمجة داخل التطبيقات (واتساب، ماسح الرموز) تمنع الطباعة
    var canPrint = typeof window.print === 'function';

    if (sb) sb.onclick = function () {
      var worked = false;
      if (canPrint) {
        try {
          var before = Date.now();
          window.print();
          // نافذة الطباعة الحقيقية توقف التنفيذ لحظات؛ الرجوع الفوري يعني أنها لم تفتح
          worked = (Date.now() - before) > 250;
        } catch (e) { worked = false; }
      }
      if (!worked && warn) warn.style.display = 'block';
    };

    if (alt && navigator.share) {
      alt.style.display = 'block';
      alt.onclick = function () {
        navigator.share({ title: 'نتيجة فحص', url: location.href }).catch(function () {});
      };
    }
  }

  function paintBrand(b) {
    if (!b) return;
    window.__brand = b;
    // الترويسة تدخل في بناء كل صفحة، فنعيد الرسم إن كانت النتيجة ظاهرة
    if (lastData) render(lastData);
    // صور الترويسة تُغيّر ارتفاع الورقة بعد تحميلها
    Array.prototype.forEach.call(document.querySelectorAll('.brandimg'), function (im) {
      if (im.complete) fitPage(); else im.onload = fitPage;
    });
    fitPage();
  }

  function loadBrand() {
    // من الذاكرة المحلية أولاً — حتى لا تُحمّل الصور مع كل فتحة
    try {
      var c = localStorage.getItem('alwateen_brand');
      if (c) paintBrand(JSON.parse(c));
    } catch (e) { /* لا يهم */ }

    fetch(docUrl('_brand'))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var raw = j && j.fields && j.fields.data && j.fields.data.stringValue;
        if (!raw) return;
        try { localStorage.setItem('alwateen_brand', raw); } catch (e) { /* ممتلئ */ }
        if (!window.__brand) paintBrand(JSON.parse(raw));
      })
      .catch(function () { /* الترويسة ليست ضرورية لعرض النتيجة */ });
  }

  function docUrl(id) {
    return 'https://firestore.googleapis.com/v1/projects/' + PROJECT +
           '/databases/(default)/documents/results/' + encodeURIComponent(id) + '?key=' + KEY;
  }

  function load() {
    var code = new URLSearchParams(location.search).get('c');
    if (!code || !/^[a-f0-9]{16,64}$/i.test(code)) {
      state('الرابط غير مكتمل',
        'امسح الباركود من ورقة النتيجة مرة أخرى، أو افتح الرابط كاملاً كما هو.');
      return;
    }

    pagesEl.innerHTML = '<div class="page"><div class="pbody"><div class="state"><div class="spin"></div><p>جارٍ فتح النتيجة…</p></div></div></div>';
    fitPage();

    fetch(docUrl(code))
      .then(function (res) {
        if (res.status === 404) {
          state('النتيجة غير متاحة',
            'قد تكون لم تُعتمد بعد. راجع المختبر للتأكد.');
          return null;
        }
        if (!res.ok) throw new Error('http ' + res.status);
        return res.json();
      })
      .then(function (j) {
        if (!j) return;
        var raw = j.fields && j.fields.data && j.fields.data.stringValue;
        if (!raw) throw new Error('empty');
        render(JSON.parse(raw));
      })
      .catch(function () {
        state('تعذّر فتح النتيجة',
          'تأكد من اتصالك بالإنترنت ثم أعد المحاولة.', true);
      });
  }

  loadBrand();
  load();
})();
</script>
</body>
</html>
